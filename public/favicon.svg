<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#streamGrad)" />
  <!-- Subtitle Chat Bubble -->
  <rect x="10" y="11" width="44" height="26" rx="8" fill="#ffffff" filter="url(#iconShadow)" />
  <!-- Subtitle lines in bubble (Dual language indicator) -->
  <rect x="16" y="18" width="18" height="3.5" rx="1.75" fill="#4f46e5" />
  <rect x="16" y="25.5" width="32" height="3.5" rx="1.75" fill="#06b6d4" />
  <!-- Microphone Motif -->
  <g transform="translate(32, 45)" filter="url(#iconShadow)">
    <!-- Mic body -->
    <rect x="-4.5" y="-11" width="9" height="15" rx="4.5" fill="#ffffff" />
    <!-- Mic stand arc -->
    <path d="M-8.5 -5 C-8.5 2.5, 8.5 2.5, 8.5 -5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Mic pole -->
    <line x1="0" y1="2.5" x2="0" y2="7.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Mic base -->
    <line x1="-5.5" y1="7.5" x2="5.5" y2="7.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>